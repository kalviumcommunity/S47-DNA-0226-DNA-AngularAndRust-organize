<div class="form-container">
  <app-card 
    cardTitle="Tenant Support Contact" 
    subtitle="Declarative Template-Driven Form Example"
    accentColor="blue">
    
    <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" id="name" name="name" 
          [(ngModel)]="contactData.name" 
          #name="ngModel"
          required minlength="3"
          placeholder="e.g. John Doe"
          [class.invalid]="name.touched && name.invalid" />
        
        <div *ngIf="name.touched && name.errors" class="error-msg">
          <small *ngIf="name.errors?.['required']">Name is required.</small>
          <small *ngIf="name.errors?.['minlength']">Name must be at least 3 characters.</small>
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Contact Email</label>
        <input 
          type="email" id="email" name="email" 
          [(ngModel)]="contactData.email" 
          #email="ngModel"
          required email
          placeholder="tenant@university.edu"
          [class.invalid]="email.touched && email.invalid" />
        
        <div *ngIf="email.touched && email.errors" class="error-msg">
          <small *ngIf="email.errors?.['required']">Email is required.</small>
          <small *ngIf="email.errors?.['email']">Please enter a valid institutional email.</small>
        </div>
      </div>

      <!-- Message Field -->
      <div class="form-group">
        <label for="message">Support Message</label>
        <textarea 
          id="message" name="message" 
          [(ngModel)]="contactData.message" 
          #message="ngModel"
          required minlength="10"
          rows="4" 
          placeholder="Describe your issue or feedback..."
          [class.invalid]="message.touched && message.invalid"></textarea>
        
        <div *ngIf="message.touched && message.errors" class="error-msg">
          <small *ngIf="message.errors?.['required']">Message is required.</small>
          <small *ngIf="message.errors?.['minlength']">Message must be at least 10 characters.</small>
        </div>
      </div>

      <div class="form-actions">
        <!-- Shared Button for submission -->
        <button type="submit" class="btn-submit" [disabled]="contactForm.invalid">Send Message</button>
        <app-button 
          label="Reset" 
          btnType="text" 
          (buttonClick)="resetForm(contactForm)">
        </app-button>
      </div>
    </form>

    <div card-footer class="submission-summary" *ngIf="submittedData">
      <h4>📨 Message Sent</h4>
      <p><strong>From:</strong> {{ submittedData.name }} ({{ submittedData.email }})</p>
      <p><strong>Content:</strong> {{ submittedData.message }}</p>
    </div>
  </app-card>
</div>
