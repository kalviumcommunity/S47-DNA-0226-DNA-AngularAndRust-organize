<div class="form-container">
  <app-card 
    cardTitle="Create Advanced Workflow" 
    subtitle="Configure institutional automated approval chains"
    accentColor="purple">
    
    <form [formGroup]="workflowForm" (ngSubmit)="onSubmit()">
      <!-- Workflow Title -->
      <div class="form-group">
        <label for="title">Request Title</label>
        <input 
          type="text" id="title" 
          formControlName="title" 
          placeholder="e.g. Annual Budget Approval"
          [class.invalid]="f['title'].touched && f['title'].invalid" />
        
        <div *ngIf="f['title'].touched && f['title'].errors" class="error-msg">
          <small *ngIf="f['title'].errors['required']">Title is required.</small>
          <small *ngIf="f['title'].errors['minlength']">Title must be at least 5 characters.</small>
        </div>
      </div>

      <!-- Department & Priority in a Row -->
      <div class="form-row">
        <div class="form-group col">
          <label for="department">Department</label>
          <select id="department" formControlName="department" [class.invalid]="f['department'].touched && f['department'].invalid">
            <option value="">Select Department</option>
            <option value="HR">Human Resources</option>
            <option value="Academics">Academics</option>
            <option value="Finance">Finance</option>
            <option value="Admin">Administration</option>
          </select>
          <small *ngIf="f['department'].touched && f['department'].errors?.['required']" class="error-msg">Please select a department.</small>
        </div>

        <div class="form-group col">
          <label for="priority">Priority</label>
          <select id="priority" formControlName="priority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>

      <!-- Requester Email -->
      <div class="form-group">
        <label for="email">Requester Email</label>
        <input 
          type="email" id="email" 
          formControlName="requesterEmail" 
          placeholder="personal@institution.edu"
          [class.invalid]="f['requesterEmail'].touched && f['requesterEmail'].invalid" />
        
        <div *ngIf="f['requesterEmail'].touched && f['requesterEmail'].errors" class="error-msg">
          <small *ngIf="f['requesterEmail'].errors['required']">Email is required.</small>
          <small *ngIf="f['requesterEmail'].errors['email']">Please enter a valid email address.</small>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description">Detailed Description</label>
        <textarea 
          id="description" 
          formControlName="description" 
          rows="4" 
          placeholder="Outline the steps and purpose for this workflow..."
          [class.invalid]="f['description'].touched && f['description'].invalid"></textarea>
        
        <div *ngIf="f['description'].touched && f['description'].errors" class="error-msg">
          <small *ngIf="f['description'].errors['required']">Description is required.</small>
          <small *ngIf="f['description'].errors['minlength']">Description must be at least 10 characters.</small>
        </div>
      </div>

      <div class="form-actions">
        <app-button 
          label="Submit Workflow" 
          btnType="primary" 
          type="submit">
        </app-button>
        <app-button 
          label="Clear Form" 
          btnType="text" 
          (buttonClick)="resetForm()">
        </app-button>
      </div>
    </form>

    <!-- Form State Summary Display -->
    <div card-footer class="submission-summary" *ngIf="submittedData">
      <h4>✅ Submission Received</h4>
      <pre>{{ submittedData | json }}</pre>
    </div>
  </app-card>
</div>
