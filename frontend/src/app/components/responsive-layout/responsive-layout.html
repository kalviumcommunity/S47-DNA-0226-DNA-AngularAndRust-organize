<div class="dashboard-wrapper">
  <header class="dashboard-header">
    <div class="header-content">
      <h1>Multi-Tenant Insights</h1>
      <p>Overview of institutional workflows across all departments</p>
    </div>
    <div class="header-actions">
      <app-button label="Refresh Data" btnType="secondary"></app-button>
    </div>
  </header>

  <section class="stats-grid">
    @for (item of stats; track item.title) {
      <app-card 
        [cardTitle]="item.title" 
        [icon]="item.icon" 
        [accentColor]="item.color">
        
        <div class="stat-info-body">
          <p class="stat-value">{{ item.value }}</p>
          <span class="stat-change" [class.positive]="item.change.startsWith('+')">
            {{ item.change }}
          </span>
        </div>
      </app-card>
    }
  </section>

  <!-- Main Content Grid: Demonstrates 2-column layout that stacks on mobile -->
  <div class="content-main-grid">
    <section class="activity-section">
      <app-card cardTitle="Recent Action Log">
        <div class="activity-list">
          @for (act of recentActivity; track act.time) {
            <div class="activity-item">
              <div class="activity-meta">
                <span class="user-name">{{ act.user }}</span>
                <span class="dept-badge">{{ act.dept }}</span>
              </div>
              <p class="action-text">{{ act.action }}</p>
              <span class="time-stamp">{{ act.time }}</span>
            </div>
          }
        </div>
      </app-card>
    </section>

    <section class="quick-links-section">
      <app-card cardTitle="Platform Configuration" accentColor="blue">
        <div class="config-actions">
          <app-button label="Manage Tenants" btnType="tile"></app-button>
          <app-button label="User Permissions" btnType="tile"></app-button>
          <app-button label="System Logs" btnType="tile"></app-button>
          <app-button label="API Settings" btnType="tile"></app-button>
        </div>
      </app-card>
    </section>
  </div>
</div>
