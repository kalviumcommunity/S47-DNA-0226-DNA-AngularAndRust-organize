<div class="auth-page">
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <div class="auth-logo">🏢</div>
      <h1>Register Institution</h1>
      <p>Set up your organization on the platform</p>
    </div>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="reg-tenant">Institution Name</label>
        <input id="reg-tenant" class="form-input" type="text" [(ngModel)]="tenantName" name="tenantName" placeholder="e.g. ABC College" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-name">Admin Full Name</label>
        <input id="reg-name" class="form-input" type="text" [(ngModel)]="adminName" name="adminName" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Admin Email</label>
        <input id="reg-email" class="form-input" type="email" [(ngModel)]="adminEmail" name="adminEmail" placeholder="admin@institution.edu" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <input id="reg-password" class="form-input" type="password" [(ngModel)]="adminPassword" name="adminPassword" placeholder="Minimum 6 characters" required />
      </div>

      <button type="submit" class="btn btn-primary btn-lg auth-submit" [disabled]="loading || !tenantName || !adminName || !adminEmail || !adminPassword" id="register-submit">
        @if (loading) { <span class="spinner"></span> }
        {{ loading ? 'Creating...' : 'Register Institution' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already registered? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
